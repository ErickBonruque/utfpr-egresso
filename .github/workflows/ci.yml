name: CI

on:
  push:
    paths: ["app/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/ci.yml"]

jobs:
  check:
    name: Lint, tipos e testes de unidade
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Lint (Biome)
        run: npx biome ci

      - name: Types (tsc)
        run: npm run typecheck

      - name: Tests (Vitest)
        run: npm test

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    # Postgres de verdade: os fluxos testados aqui (sessão, server action,
    # escrita do perfil de egresso) não existem sem banco.
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cea
          POSTGRES_PASSWORD: cea_dev_password
          POSTGRES_DB: cea
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cea -d cea"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://cea:cea_dev_password@localhost:5432/cea
      # Segredo descartável de CI — o de produção vive no provedor de deploy.
      BETTER_AUTH_SECRET: ci-only-secret-nao-usar-em-producao-000000
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Migrations + seed
        run: npx prisma migrate deploy && npx prisma db seed

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run test:e2e

      - name: Relatório (quando falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app/playwright-report
          retention-days: 7
