{% load static %}
<!DOCTYPE html>
<html lang="pt-br" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema CEA - Conexão Egresso-Aluno{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="{% static 'css/style.css' %}" rel="stylesheet">

    <!-- Pré-carrega ambas as logos para evitar flash ao trocar de tema -->
    <link rel="preload" as="image" href="{% static 'img/logo_UTFPR_cor.png' %}">
    <link rel="preload" as="image" href="{% static 'img/logo_UTFPR_cor_branco.png' %}">

    <!-- Script inline para aplicar tema ANTES do render (previne flash branco) -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('cea-theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>

    <link href="{% static 'css/theme.css' %}" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    {% include 'partials/_navbar.html' %}


    {% block content %}
    {% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/script.js' %}"></script>
    <script>
        // ============================================
        // DROPDOWN DO PERFIL
        // ============================================
        (function () {
            const btn = document.getElementById('userAvatarBtn');
            const dropdown = document.getElementById('profileDropdown');

            btn.addEventListener('click', function (e) {
                e.stopPropagation();
                dropdown.classList.toggle('show');
            });

            document.addEventListener('click', function (e) {
                if (!dropdown.contains(e.target) && e.target !== btn) {
                    dropdown.classList.remove('show');
                }
            });
        })();

        // ============================================
        // NAVBAR: POPULATE STUDENT INFO FROM DB
        // ============================================
        (function () {
            {% if aluno_json %}
            const data = {{ aluno_json|safe }};
            {% else %}
            const data = null;
            {% endif %}

            if (!data) return;

            function initials(name) {
                const parts = name.trim().split(/\s+/);
                if (parts.length >= 2) return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
                return parts[0].slice(0, 2).toUpperCase();
            }

            function statusLabel(s) {
                return { ativo: 'Ativo', formado: 'Formado', trancado: 'Trancado', evadido: 'Evadido' }[s] || s;
            }

            const name = data.name || 'Aluno';
            const period = data.status === 'formado' ? 'Formado' : `${data.currentPeriod}º Período`;
            const gpa = data.gpa != null ? `CR: ${data.gpa.toFixed(1)}` : '';
            const pct = data.totalCourseWorkload
                ? Math.round(data.completedWorkload / data.totalCourseWorkload * 100) : 0;
            const detail = [period, gpa, `${pct}%`].filter(Boolean).join(' • ');

            const badge = document.getElementById('navUserBadge');
            const uname = document.getElementById('navUserName');
            const udetail = document.getElementById('navUserDetail');
            const avatar = document.getElementById('userAvatarBtn');
            const dname = document.getElementById('navDropdownName');
            const ddetail = document.getElementById('navDropdownDetail');

            if (badge) badge.textContent = `${statusLabel(data.status)} • ${pct}% concluído`;
            if (uname) uname.textContent = name;
            if (udetail) udetail.textContent = detail;
            if (avatar) avatar.textContent = initials(name);
            if (dname) dname.textContent = name;
            if (ddetail) ddetail.textContent = detail;
        })();

        // ============================================
        // TROCAR ALUNO (MODAL COM ALUNOS ATIVOS)
        // ============================================
        (function () {
            const trigger = document.getElementById('openStudentSwitcher');
            const modalEl = document.getElementById('studentSwitcherModal');
            const searchInput = document.getElementById('student-search-input');
            const listEl = document.getElementById('student-list');
            const emptyEl = document.getElementById('student-list-empty');
            const dropdown = document.getElementById('profileDropdown');
            if (!trigger || !modalEl || !searchInput || !listEl || !emptyEl) return;

            const hasBootstrapModal = !!(window.bootstrap && window.bootstrap.Modal);
            const modal = hasBootstrapModal ? new window.bootstrap.Modal(modalEl) : null;
            let debounce = null;

            function esc(text) {
                const d = document.createElement('div');
                d.textContent = text || '';
                return d.innerHTML;
            }

            function goToStudent(studentId) {
                // Usa POST para trocar sessão e redireciona para a página atual com ?id=
                const currentPath = window.location.pathname;
                fetch('/api/trocar-aluno/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: studentId, redirect: currentPath }),
                })
                .then(r => r.json())
                .then(data => {
                    if (data.redirect) {
                        window.location.href = data.redirect;
                    } else {
                        window.location.href = currentPath + '?id=' + studentId;
                    }
                })
                .catch(() => {
                    // Fallback direto caso fetch falhe
                    window.location.href = currentPath + '?id=' + studentId;
                });
            }

            function renderList(students) {
                listEl.innerHTML = '';
                if (!students.length) {
                    emptyEl.style.display = 'block';
                    return;
                }
                emptyEl.style.display = 'none';

                students.forEach(student => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'list-group-item list-group-item-action d-flex justify-content-between align-items-center';
                    btn.innerHTML = `
                        <span>
                            <strong>${esc(student.name)}</strong>
                            <small class="d-block text-muted">${esc(student.course || '')} • ${esc(student.currentPeriod)}º período</small>
                        </span>
                        <i class="bi bi-arrow-right"></i>
                    `;
                    btn.addEventListener('click', () => goToStudent(student.id));
                    listEl.appendChild(btn);
                });
            }

            async function loadStudents(query) {
                try {
                    const qs = new URLSearchParams();
                    if (query) qs.set('search', query);
                    const res = await fetch(`/api/alunos-ativos/?${qs.toString()}`, { cache: 'no-store' });
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    const data = await res.json();
                    renderList(data.results || []);
                } catch (_) {
                    renderList([]);
                }
            }

            trigger.addEventListener('click', (e) => {
                e.preventDefault();
                dropdown.classList.remove('show');
                searchInput.value = '';
                if (modal) {
                    modal.show();
                    loadStudents('');
                } else {
                    // Fallback seguro caso o JS do Bootstrap não carregue em produção.
                    window.location.href = '/egressos/';
                }
            });

            searchInput.addEventListener('input', () => {
                clearTimeout(debounce);
                debounce = setTimeout(() => loadStudents(searchInput.value.trim()), 250);
            });
        })();

        // ============================================
        // DARK MODE TOGGLE + TROCA DE LOGO
        // ============================================
        (function () {
            const toggle = document.getElementById('themeToggle');
            const logo = document.getElementById('navbarLogo');
            const savedTheme = localStorage.getItem('cea-theme') || 'light';

            function applyTheme(theme) {
                document.documentElement.setAttribute('data-theme', theme);
                // Trocar logo para versão adequada ao tema
                if (logo) {
                    logo.src = theme === 'dark' ? logo.dataset.dark : logo.dataset.light;
                }
            }

            // Sincronizar estado do toggle e logo com o tema já aplicado no head
            toggle.checked = savedTheme === 'dark';
            if (logo) {
                logo.src = savedTheme === 'dark' ? logo.dataset.dark : logo.dataset.light;
            }

            // Gerenciar mudança de tema pelo toggle
            toggle.addEventListener('change', function () {
                const theme = this.checked ? 'dark' : 'light';
                applyTheme(theme);
                localStorage.setItem('cea-theme', theme);
            });
        })();
    </script>
</body>

</html>
